[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
hdi = "=0.8.0"
hdk = "=0.7.0"
serde = "1"
holochain = { version = "=0.7.0", default-features = false, features = ["encryption", "wasmer-sys-cranelift"] }

holochain_serialized_bytes = "0.0.57"

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
