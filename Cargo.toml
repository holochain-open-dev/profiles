[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
hdi = "0.8.0-dev"
hdk = "0.7.0-dev"
serde = "1"
holochain = { version = "0.7.0-dev", default-features = false, features = ["sqlite-encrypted", "wasmer-sys-cranelift", "transport-iroh"] }

holochain_serialized_bytes = "0.0.57"

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
