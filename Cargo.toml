[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
hdi = "0.7.1"
hdk = "0.6.1"
serde = "1"
#holochain = "0.6.0-rc.2"
holochain = {version = "0.6.1", default-features = false, features = ["sqlite-encrypted", "wasmer_sys"] }

holochain_serialized_bytes = "0.0.57"

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
